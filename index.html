<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予定入力</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 20px;
      padding-bottom: 120px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }
    
    .month-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
    }
    
    .month-selector select {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white;
    }
    
    .calendar-container {
      margin-bottom: 24px;
    }
    
    .calendar-header {
      display: grid;
      grid-template-columns: 80px repeat(2, 1fr);
      gap: 8px;
      padding: 12px 8px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #666;
    }
    
    .calendar-row {
      padding: 12px 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .calendar-row:last-child {
      border-bottom: none;
    }
    
    .row-main {
      display: grid;
      grid-template-columns: 80px repeat(2, 1fr);
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .row-note {
      padding-left: 88px;
    }
    
    .date-label {
      font-size: 14px;
      color: #333;
      font-weight: 500;
    }
    
    .date-label .weekday {
      font-size: 12px;
      color: #999;
      margin-left: 4px;
    }
    
    .date-label .weekday.sunday {
      color: #ef5350;
    }
    
    .date-label .weekday.saturday {
      color: #42a5f5;
    }
    
    .period-buttons {
      display: flex;
      gap: 4px;
    }
    
    .period-btn {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .period-btn.active-ok {
      background: #06c755;
      color: white;
      border-color: #06c755;
    }
    
    .period-btn.active-maybe {
      background: #ffb74d;
      color: white;
      border-color: #ffb74d;
    }
    
    .period-btn.active-ng {
      background: #ef5350;
      color: white;
      border-color: #ef5350;
    }
    
    .note-input {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      display: none;
    }
    
    .note-input.show {
      display: block;
    }
    
    .note-input:focus {
      outline: none;
      border-color: #06c755;
    }
    
    .action-buttons {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 16px 20px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }
    
    .button-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .status-message {
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      display: none;
      margin-bottom: 12px;
    }
    
    .status-message.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    
    .status-message.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }
    
    .status-message.processing {
      background: #e3f2fd;
      color: #1976d2;
      display: block;
    }
    
    .btn {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #06c755;
      color: white;
    }
    
    .btn-primary:hover {
      background: #05b34a;
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
      font-size: 14px;
    }
    
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    
    .message.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }
    
    .message.info {
      background: #e3f2fd;
      color: #1976d2;
      display: block;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 12px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid #e0e0e0;
    }
    
    .legend-color.ok {
      background: #06c755;
      border-color: #06c755;
    }
    
    .legend-color.maybe {
      background: #ffb74d;
      border-color: #ffb74d;
    }
    
    .legend-color.ng {
      background: #ef5350;
      border-color: #ef5350;
    }
    
    .note-hint {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">読み込み中...</div>
    
    <div id="app" style="display: none;">
      <h1>予定入力</h1>
      <div class="subtitle" id="user-name"></div>
      
      <div id="message" class="message"></div>
      
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color ok"></div>
          <span>○ 対応できる！</span>
        </div>
        <div class="legend-item">
          <div class="legend-color maybe"></div>
          <span>△ 対応できるかも！</span>
        </div>
        <div class="legend-item">
          <div class="legend-color ng"></div>
          <span>× 対応できない</span>
        </div>
      </div>
      
      <div class="note-hint">
        ○や△を選択すると備考欄が表示されます（任意）
      </div>
      
      <div class="month-selector">
        <select id="month-select">
          <!-- JavaScriptで動的生成 -->
        </select>
      </div>
      
      <div class="calendar-container">
        <div class="calendar-header">
          <div>日付</div>
          <div style="text-align: center;">午前</div>
          <div style="text-align: center;">午後</div>
        </div>
        <div id="calendar-body">
          <!-- JavaScriptで動的生成 -->
        </div>
      </div>
      
      <div class="action-buttons">
        <div id="status-message" class="status-message"></div>
        <div class="button-row">
          <button class="btn btn-secondary" id="clear-btn">クリア</button>
          <button class="btn btn-primary" id="submit-btn">一括登録</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // 設定
    // ========================================
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxeZ1O7nVYkIPy5QiyqKxwFlYIxtjUmJImPFQt5vXT4jALFx4lcUtmFrsTL986vgRsJ/exec';
    const LIFF_ID = '2009744062-9ppCT2Sl';
    
    let userId = null;
    let userName = null;
    let scheduleData = {}; // { 'YYYY-MM-DD': { morning: '○', afternoon: '×', note: '15時以降可' } }
    let existingSchedules = {};
    
    // ========================================
    // ユーティリティ関数
    // ========================================
    
    // メッセージ表示
    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      
      if (type === 'success') {
        setTimeout(() => {
          messageEl.style.display = 'none';
        }, 3000);
      }
    }
    
    // ステータスメッセージ表示
    function showStatus(text, type) {
      const statusEl = document.getElementById('status-message');
      statusEl.textContent = text;
      statusEl.className = `status-message ${type}`;
      
      if (type === 'success' || type === 'error') {
        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 3000);
      }
    }
    
    // 曜日取得
    function getWeekday(date) {
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return weekdays[date.getDay()];
    }
    
    // 曜日クラス取得
    function getWeekdayClass(date) {
      const day = date.getDay();
      if (day === 0) return 'sunday';
      if (day === 6) return 'saturday';
      return '';
    }
    
    // ========================================
    // LIFF初期化
    // ========================================
    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        
        // プロフィール取得
        const profile = await liff.getProfile();
        userId = profile.userId;
        userName = profile.displayName;
        
        document.getElementById('user-name').textContent = userName + ' さん';
        
        // 既存予定を取得
        await loadExistingSchedules();
        
        // UI表示
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        // 月選択肢を生成
        generateMonthOptions();
        
        // カレンダー生成
        generateCalendar();
        
        // イベントリスナー設定
        setupEventListeners();
        
      } catch (error) {
        console.error('LIFF初期化エラー:', error);
        showMessage('初期化に失敗しました', 'error');
      }
    }
    
    // ========================================
    // 既存予定の読み込み
    // ========================================
    async function loadExistingSchedules() {
      try {
        const response = await fetch(GAS_ENDPOINT + '?action=getSchedule&userId=' + userId);
        const result = await response.json();
        
        if (result.success && result.schedules) {
          result.schedules.forEach(schedule => {
            existingSchedules[schedule.date] = {
              morning: schedule.morning,
              afternoon: schedule.afternoon,
              note: schedule.note || ''
            };
            // 現在の選択状態にも反映
            scheduleData[schedule.date] = {
              morning: schedule.morning,
              afternoon: schedule.afternoon,
              note: schedule.note || ''
            };
          });
          
          console.log('既存予定を読み込みました:', existingSchedules);
        }
      } catch (error) {
        console.error('既存予定の読み込みエラー:', error);
      }
    }
    
    // ========================================
    // 月選択肢生成
    // ========================================
    function generateMonthOptions() {
      const select = document.getElementById('month-select');
      const today = new Date();
      
      // 今月から6ヶ月分
      for (let i = 0; i < 6; i++) {
        const date = new Date(today.getFullYear(), today.getMonth() + i, 1);
        const option = document.createElement('option');
        option.value = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        option.textContent = `${date.getFullYear()}年${date.getMonth() + 1}月`;
        if (i === 0) option.selected = true;
        select.appendChild(option);
      }
    }
    
    // ========================================
    // カレンダー生成
    // ========================================
    function generateCalendar() {
      const monthSelect = document.getElementById('month-select');
      const [year, month] = monthSelect.value.split('-').map(Number);
      
      const calendarBody = document.getElementById('calendar-body');
      calendarBody.innerHTML = '';
      
      // 月の日数を取得
      const daysInMonth = new Date(year, month, 0).getDate();
      
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month - 1, day);
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const row = document.createElement('div');
        row.className = 'calendar-row';
        
        // メイン行
        const mainRow = document.createElement('div');
        mainRow.className = 'row-main';
        
        // 日付ラベル
        const dateLabel = document.createElement('div');
        dateLabel.className = 'date-label';
        const weekday = getWeekday(date);
        const weekdayClass = getWeekdayClass(date);
        dateLabel.innerHTML = `${month}/${day} <span class="weekday ${weekdayClass}">(${weekday})</span>`;
        mainRow.appendChild(dateLabel);
        
        // 午前ボタン
        const morningButtons = createPeriodButtons(dateStr, 'morning');
        mainRow.appendChild(morningButtons);
        
        // 午後ボタン
        const afternoonButtons = createPeriodButtons(dateStr, 'afternoon');
        mainRow.appendChild(afternoonButtons);
        
        row.appendChild(mainRow);
        
        // 備考行
        const noteRow = document.createElement('div');
        noteRow.className = 'row-note';
        const noteInput = document.createElement('input');
        noteInput.type = 'text';
        noteInput.className = 'note-input';
        noteInput.id = `note-${dateStr}`;
        noteInput.placeholder = '備考（例：15時以降可）';
        noteInput.maxLength = 30;
        
        // 既存の備考を反映
        if (scheduleData[dateStr] && scheduleData[dateStr].note) {
          noteInput.value = scheduleData[dateStr].note;
          noteInput.classList.add('show');
        }
        
        noteInput.addEventListener('input', function() {
          if (!scheduleData[dateStr]) {
            scheduleData[dateStr] = {};
          }
          scheduleData[dateStr].note = this.value;
        });
        
        noteRow.appendChild(noteInput);
        row.appendChild(noteRow);
        
        calendarBody.appendChild(row);
      }
    }
    
    // ========================================
    // 期間ボタン作成
    // ========================================
    function createPeriodButtons(dateStr, period) {
      const container = document.createElement('div');
      container.className = 'period-buttons';
      
      const values = ['○', '△', '×'];
      
      values.forEach(value => {
        const btn = document.createElement('button');
        btn.className = 'period-btn';
        btn.textContent = value;
        btn.dataset.date = dateStr;
        btn.dataset.period = period;
        btn.dataset.value = value;
        
        // 既存の選択状態を反映
        if (scheduleData[dateStr] && scheduleData[dateStr][period] === value) {
          if (value === '○') btn.classList.add('active-ok');
          else if (value === '△') btn.classList.add('active-maybe');
          else btn.classList.add('active-ng');
        }
        
        btn.addEventListener('click', function() {
          handlePeriodClick(dateStr, period, value, this);
        });
        
        container.appendChild(btn);
      });
      
      return container;
    }
    
    // ========================================
    // 期間ボタンクリック処理
    // ========================================
    function handlePeriodClick(dateStr, period, value, btn) {
      // 同じperiodの他のボタンの選択解除
      const periodButtons = document.querySelectorAll(`[data-date="${dateStr}"][data-period="${period}"]`);
      periodButtons.forEach(b => {
        b.classList.remove('active-ok', 'active-maybe', 'active-ng');
      });
      
      // 選択状態を設定
      if (value === '○') {
        btn.classList.add('active-ok');
      } else if (value === '△') {
        btn.classList.add('active-maybe');
      } else {
        btn.classList.add('active-ng');
      }
      
      // データ保存
      if (!scheduleData[dateStr]) {
        scheduleData[dateStr] = {};
      }
      scheduleData[dateStr][period] = value;
      
      // 備考欄の表示/非表示
      updateNoteVisibility(dateStr);
    }
    
    // ========================================
    // 備考欄の表示制御
    // ========================================
    function updateNoteVisibility(dateStr) {
      const noteInput = document.getElementById(`note-${dateStr}`);
      if (!noteInput) return;
      
      const data = scheduleData[dateStr];
      
      // ○か△が選択されている場合のみ表示
      if (data && (data.morning === '○' || data.morning === '△' || 
                   data.afternoon === '○' || data.afternoon === '△')) {
        noteInput.classList.add('show');
      } else {
        noteInput.classList.remove('show');
        noteInput.value = '';
        if (data) {
          data.note = '';
        }
      }
    }
    
    // ========================================
    // イベントリスナー設定
    // ========================================
    function setupEventListeners() {
      // 月変更
      document.getElementById('month-select').addEventListener('change', generateCalendar);
      
      // クリアボタン
      document.getElementById('clear-btn').addEventListener('click', () => {
        if (confirm('選択した予定をすべてクリアしますか？')) {
          scheduleData = {};
          generateCalendar();
          showStatus('クリアしました', 'success');
        }
      });
      
      // 登録ボタン
      document.getElementById('submit-btn').addEventListener('click', submitAllSchedules);
    }
    
    // ========================================
    // 一括登録
    // ========================================
    async function submitAllSchedules() {
      const dates = Object.keys(scheduleData);
      
      if (dates.length === 0) {
        showStatus('予定が選択されていません', 'error');
        return;
      }
      
      // 午前・午後両方が選択されているかチェック
      const incompleteDates = dates.filter(date => {
        return !scheduleData[date].morning || !scheduleData[date].afternoon;
      });
      
      if (incompleteDates.length > 0) {
        showStatus('午前・午後の両方を選択してください', 'error');
        return;
      }
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '登録中...';
      showStatus('登録中...', 'processing');
      
      try {
        // データを配列に変換
        const schedules = dates.map(date => ({
          date: date,
          morning: scheduleData[date].morning,
          afternoon: scheduleData[date].afternoon,
          note: scheduleData[date].note || ''
        }));
        
        const response = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain',
          },
          body: JSON.stringify({
            userId: userId,
            userName: userName,
            schedules: schedules,
            bulk: true
          })
        });
        
        if (!response.ok) {
          throw new Error('HTTP Error: ' + response.status);
        }
        
        const result = await response.json();
        
        if (result.success) {
          showStatus(`${schedules.length}日分の予定を登録しました！`, 'success');
          
          // 既存予定を更新
          schedules.forEach(schedule => {
            existingSchedules[schedule.date] = {
              morning: schedule.morning,
              afternoon: schedule.afternoon,
              note: schedule.note
            };
          });
          
          setTimeout(() => {
            liff.closeWindow();
          }, 2000);
        } else {
          throw new Error(result.error || '登録に失敗しました');
        }
        
      } catch (error) {
        console.error('登録エラー:', error);
        showStatus('登録に失敗しました', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '一括登録';
      }
    }
    
    // ========================================
    // 初期化実行
    // ========================================
    initializeLiff();
  </script>
</body>
</html>
